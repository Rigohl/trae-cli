name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install sccache
        run: |
          cargo install sccache --locked

      - name: Cache sccache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache incremental target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache incremental target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fmt check
        run: |
          cargo fmt -- --check

      - name: Run code-health (fast static checks)
        shell: pwsh
        run: |
          pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File ./scripts/code-health.ps1

      - name: Affected-only checks (fast-path for PRs)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File ./scripts/affected-checks.ps1 -Ci

      - name: Affected-only tests (fast-path for PRs)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File ./scripts/affected-tests.ps1 -Ci

      - name: Run clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: |
          cargo test --all --release
      - name: Build release
        run: |
          cargo build --release

      - name: Run code-health (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/code-health.ps1

