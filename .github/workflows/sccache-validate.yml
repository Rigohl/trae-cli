name: sccache-validate

on:
  workflow_dispatch:

jobs:
  validate-remote:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SCCACHE_REDIS: ${{ secrets.SCCACHE_REDIS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install sccache
        run: |
          cargo install sccache --locked

      - name: Show configured backend (masked)
        run: |
          if [ -n "${SCCACHE_BUCKET:-}" ]; then echo "SCCACHE_BUCKET configured"; else echo "SCCACHE_BUCKET not set"; fi
          if [ -n "${SCCACHE_REDIS:-}" ]; then echo "SCCACHE_REDIS configured"; else echo "SCCACHE_REDIS not set"; fi

      - name: Validate S3-backed sccache (if configured)
        if: env.SCCACHE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.SCCACHE_REGION }}

      - name: Check S3 bucket access
        if: env.SCCACHE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          echo "Checking access to S3 bucket (name masked)"
          aws s3api head-bucket --bucket "$SCCACHE_BUCKET" --region "${SCCACHE_REGION:-us-east-1}" >/dev/null 2>&1 && echo "S3 bucket is reachable with provided credentials" || (echo "S3 bucket access check failed" >&2; exit 1)

      - name: Validate Redis connectivity (if configured)
        if: env.SCCACHE_REDIS != ''
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse, socket
          url = os.environ.get('SCCACHE_REDIS')
          if not url:
              print('SCCACHE_REDIS not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 6379
          print(f'Testing TCP connection to {host}:{port} (value masked)')
          try:
              sock = socket.create_connection((host, port), timeout=5)
              sock.close()
              print('TCP connection OK')
          except Exception as e:
              print(f'Failed to connect to Redis at {host}:{port}: {e}')
              sys.exit(1)
          PY

      - name: Show sccache stats
        run: |
          sccache --show-stats || true
